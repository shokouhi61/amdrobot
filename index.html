<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صرافی آنلاین ارمنستان</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #17212b;
      --card-bg: #232e3c;
      --text-color: #ffffff;
      --btn-color: #2ea6ff;
      --accent-color: #00d26a;
      --admin-color: #e74c3c;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0; padding: 12px; direction: rtl;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px; padding: 15px; margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .rate-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .rate-row:last-child { border-bottom: none; }
    input, select, textarea {
      width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
      background: #0f1721; color: #fff; box-sizing: border-box; font-size: 14px;
    }
    button {
      width: 100%; background: var(--btn-color); color: #fff;
      border: none; padding: 14px; border-radius: 8px;
      font-weight: bold; font-size: 16px; cursor: pointer;
    }
    .badge { background: var(--accent-color); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
    .hidden { display: none; }
    .invoice {
      border: 2px dashed var(--accent-color);
      padding: 15px; border-radius: 10px; background: rgba(0,210,106,0.05);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- بخش موجودی و نرخ آنلاین -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0;">🇦🇲 صرافی آنلاین ارمنستان</h3>
      <span class="badge">آنلاین</span>
    </div>

    <!-- نمایش موجودی صرافی -->
    <div style="background: rgba(0,0,0,0.25); border-radius: 8px; padding: 10px; margin-top: 12px;">
      <div class="rate-row">
        <span>💰 موجودی تومانی صرافی:</span>
        <strong id="balanceTomanDisplay" style="color: var(--btn-color);">در حال دریافت...</strong>
      </div>
      <div class="rate-row">
        <span>🪙 موجودی درامی صرافی:</span>
        <strong id="balanceDramDisplay" style="color: var(--accent-color);">در حال دریافت...</strong>
      </div>
    </div>

    <div class="rate-row" style="margin-top:10px;">
      <span>نرخ خرید درام از شما:</span>
      <strong id="buyRateDisplay" style="color: var(--accent-color);">در حال دریافت...</strong>
    </div>
    <div class="rate-row">
      <span>نرخ فروش درام به شما:</span>
      <strong id="sellRateDisplay" style="color: var(--accent-color);">در حال دریافت...</strong>
    </div>
  </div>

  <!-- فرم ثبت سفارش -->
  <div class="card" id="orderForm">
    <h3 style="margin-top: 0;">ثبت سفارش</h3>
    
    <label>نوع معامله:</label>
    <select id="tradeType" onchange="calculate()">
      <option value="buy">خرید درام (واریز تومان به صرافی)</option>
      <option value="sell">فروش درام (دریافت تومان از صرافی)</option>
    </select>

    <label>مبلغ (درام):</label>
    <input type="number" id="amount" placeholder="مثلا 50000" oninput="calculate()">

    <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
      مبلغ قابل پرداخت (تومان): <strong id="totalPrice" style="color: var(--accent-color); font-size: 1.1em;">0 تومان</strong>
    </div>

    <label>نام و نام خانوادگی:</label>
    <input type="text" id="fullName" placeholder="رضا شکوحی">

    <label>شماره واتس‌اپ:</label>
    <input type="tel" id="whatsapp" placeholder="09123456789">

    <button onclick="sendOrder()">ثبت و ارسال سفارش</button>
  </div>

  <!-- فاکتور رسمی -->
  <div class="card invoice hidden" id="invoiceCard">
    <h3 style="margin-top:0; color:var(--accent-color);">🧾 فاکتور رسمی صرافی</h3>
    <div id="invoiceContent"></div>
  </div>

  <!-- پنل مدیریت (مخصوص مدیر) -->
  <div class="card hidden" id="adminSection" style="border: 2px solid var(--admin-color);">
    <h3 style="color: var(--admin-color); margin-top: 0;">⚙️ تنظیمات عمومی مدیریت (سراسری)</h3>
    
    <label>موجودی تومانی صرافی:</label>
    <input type="text" id="adminBalanceToman" value="7,000,000,000 تومان">

    <label>موجودی درامی صرافی:</label>
    <input type="text" id="adminBalanceDram" value="10,000,000 درام">

    <label>نرخ پایه درام (تومان):</label>
    <input type="number" id="adminBaseRate" value="720">

    <label>کارمزد خرید از مشتری (%):</label>
    <input type="number" id="adminBuyFee" value="10">

    <label>کارمزد فروش به مشتری (%):</label>
    <input type="number" id="adminSellFee" value="10">

    <button style="background: var(--admin-color);" onclick="saveAdminSettings()">ثبت و آپدیت برای همه کاربران</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const ADMIN_ID = 48460135;

    let baseRate = 720;
    let buyFee = 10;
    let sellFee = 10;
    let balanceToman = "7,000,000,000 تومان";
    let balanceDram = "10,000,000 درام";

    // شناسایی مدیر
    if (tg.initDataUnsafe?.user?.id === ADMIN_ID) {
      document.getElementById('adminSection').classList.remove('hidden');
    }

    // دریافت تنظیمات بروز از وب‌سرور PythonAnywhere
    async function loadServerSettings() {
      try {
        const res = await fetch('https://shokouhi61.pythonanywhere.com/get_settings');
        if (res.ok) {
          const data = await res.json();
          baseRate = data.base_rate || 720;
          buyFee = data.buy_fee || 10;
          sellFee = data.sell_fee || 10;
          balanceToman = data.balance_toman || "7,000,000,000 تومان";
          balanceDram = data.balance_dram || "10,000,000 درام";

          document.getElementById('adminBaseRate').value = baseRate;
          document.getElementById('adminBuyFee').value = buyFee;
          document.getElementById('adminSellFee').value = sellFee;
          document.getElementById('adminBalanceToman').value = balanceToman;
          document.getElementById('adminBalanceDram').value = balanceDram;
        }
      } catch (e) {
        console.log("استفاده از تنظیمات پیش‌فرض...");
      }
      calculate();
    }

    function calculate() {
      document.getElementById('balanceTomanDisplay').innerText = balanceToman;
      document.getElementById('balanceDramDisplay').innerText = balanceDram;

      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const type = document.getElementById('tradeType').value;

      const effectiveSellRate = baseRate * (1 + (sellFee / 100));
      const effectiveBuyRate = baseRate * (1 - (buyFee / 100));

      document.getElementById('sellRateDisplay').innerText = Math.round(effectiveSellRate).toLocaleString() + ' تومان';
      document.getElementById('buyRateDisplay').innerText = Math.round(effectiveBuyRate).toLocaleString() + ' تومان';

      let total = type === 'buy' ? amount * effectiveSellRate : amount * effectiveBuyRate;
      document.getElementById('totalPrice').innerText = Math.round(total).toLocaleString() + ' تومان';
    }

    function saveAdminSettings() {
      balanceToman = document.getElementById('adminBalanceToman').value;
      balanceDram = document.getElementById('adminBalanceDram').value;
      baseRate = parseFloat(document.getElementById('adminBaseRate').value) || 720;
      buyFee = parseFloat(document.getElementById('adminBuyFee').value) || 0;
      sellFee = parseFloat(document.getElementById('adminSellFee').value) || 0;

      calculate();

      tg.sendData(JSON.stringify({
        action: "update_settings",
        base_rate: baseRate,
        buy_fee: buyFee,
        sell_fee: sellFee,
        balance_toman: balanceToman,
        balance_dram: balanceDram
      }));

      alert('✅ تنظیمات جدید ثبت شد و روی سرور قرار گرفت.');
    }

    function sendOrder() {
      const name = document.getElementById('fullName').value;
      const whatsapp = document.getElementById('whatsapp').value;
      const amount = document.getElementById('amount').value;
      const total = document.getElementById('totalPrice').innerText;
      const type = document.getElementById('tradeType').value == 'buy' ? 'خرید درام' : 'فروش درام';
      const orderId = 'AMD-' + Math.floor(100000 + Math.random() * 900000);

      if (!name || !whatsapp || !amount) {
        alert('لطفاً تمامی فیلدها را پر کنید.');
        return;
      }

      const invoiceHTML = `
        <p><b>کد پیگیری:</b> ${orderId}</p>
        <p><b>نوع معامله:</b> ${type}</p>
        <p><b>نام مشتری:</b> ${name}</p>
        <p><b>واتس‌اپ:</b> ${whatsapp}</p>
        <p><b>مبلغ معامله:</b> ${amount} درام</p>
        <p><b>مبلغ کل:</b> ${total}</p>
        <p><b>تاریخ ثبت:</b> ${new Date().toLocaleDateString('fa-IR')}</p>
      `;
      
      document.getElementById('invoiceContent').innerHTML = invoiceHTML;
      document.getElementById('invoiceCard').classList.remove('hidden');

      tg.sendData(JSON.stringify({
        action: "submit_order",
        order_id: orderId,
        name: name,
        whatsapp: whatsapp,
        amount: amount,
        trade_type: type,
        total_price: total
      }));
    }

    loadServerSettings();
  </script>
</body>
  </html>
