<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صرافی آنلاین ارمنستان</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --accent-color: #0088cc;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            direction: rtl;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .balance-item {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .balance-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .balance-val {
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, select {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .summary-box {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .btn-admin {
            background-color: var(--danger-color);
        }

        #admin-panel {
            display: none;
            border-color: var(--danger-color);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- موجودی و نرخ آنلاین -->
    <div class="card">
        <div class="card-title">💵 موجودی و نرخ لحظه‌ای صرافی</div>
        <div class="balance-grid">
            <div class="balance-item">
                <div class="balance-label">موجودی تومان</div>
                <div class="balance-val" id="disp-toman">در حال دریافت...</div>
            </div>
            <div class="balance-item">
                <div class="balance-label">موجودی درام</div>
                <div class="balance-val" id="disp-dram">در حال دریافت...</div>
            </div>
        </div>
        <div class="summary-row" style="font-size: 0.85rem; color: var(--text-muted); text-align: center; justify-content: center;">
            <span>نرخ پایه هر درام: <strong id="disp-base-rate" style="color:var(--text-color)">-</strong> تومان</span>
        </div>
    </div>

    <!-- فرم ثبت سفارش -->
    <div class="card">
        <div class="card-title">📝 ثبت سفارش معامله</div>
        
        <div class="form-group">
            <label>نوع معامله:</label>
            <select id="trade-type" onchange="calculateOrder()">
                <option value="buy">خرید از صرافی</option>
                <option value="sell">فروش به صرافی</option>
            </select>
        </div>

        <div class="form-group">
            <label>مبلغ معامله (به درام):</label>
            <input type="number" id="order-amount" placeholder="مثلاً 50000" oninput="calculateOrder()">
        </div>

        <div class="form-group">
            <label>نام و نام خانوادگی:</label>
            <input type="text" id="order-name" placeholder="نام خود را وارد کنید">
        </div>

        <div class="form-group">
            <label>شماره واتس‌‌اپ / تماس:</label>
            <input type="text" id="order-whatsapp" placeholder="09123456789">
        </div>

        <div class="summary-box">
            <div class="summary-row">
                <span>نرخ محاسبه‌شده هر درام:</span>
                <span id="calc-effective-rate">0 تومان</span>
            </div>
            <div class="summary-row">
                <span>مبلغ قابل پرداخت / دریافت:</span>
                <strong id="calc-total-price" style="color: var(--success-color)">0 تومان</strong>
            </div>
        </div>

        <button class="btn-submit" onclick="submitOrder()">ثبت و ارسال سفارش</button>
    </div>

    <!-- پنل مدیریت (مخصوص ADMIN_ID) -->
    <div class="card" id="admin-panel">
        <div class="card-title" style="color: var(--danger-color)">⚙️ تنظیمات عمومی مدیریت (سراسری)</div>
        
        <div class="form-group">
            <label>موجودی تومانی صرافی:</label>
            <input type="text" id="admin-toman" placeholder="7,000,000,000 تومان">
        </div>

        <div class="form-group">
            <label>موجودی درامی صرافی:</label>
            <input type="text" id="admin-dram" placeholder="10,000,000 درام">
        </div>

        <div class="form-group">
            <label>نرخ پایه درام (تومان):</label>
            <input type="number" id="admin-base-rate" placeholder="720">
        </div>

        <div class="form-group">
            <label>کارمزد خرید از مشتری (%):</label>
            <input type="number" id="admin-buy-fee" placeholder="10">
        </div>

        <div class="form-group">
            <label>کارمزد فروش به مشتری (%):</label>
            <input type="number" id="admin-sell-fee" placeholder="10">
        </div>

        <button class="btn-submit btn-admin" onclick="updateSettings()">ثبت و آپدیت برای همه کاربران</button>
    </div>

</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const ADMIN_ID = 48460135;
    const API_URL = "https://shokouhi61.pythonanywhere.com/get_settings";

    let settings = {
        base_rate: 720,
        buy_fee: 10,
        sell_fee: 10,
        balance_toman: "7,000,000,000 تومان",
        balance_dram: "10,000,000 درام"
    };

    // بررسی دسترسی ادمین
    const user = tg.initDataUnsafe?.user;
    if (user && user.id === ADMIN_ID) {
        document.getElementById('admin-panel').style.display = 'block';
    }

    // دریافت تنظیمات زنده از سرور Flask
    async function fetchSettings() {
        try {
            const res = await fetch(API_URL + "?t=" + new Date().getTime());
            if (res.ok) {
                const data = await res.json();
                settings.base_rate = parseFloat(data.base_rate) || 720;
                settings.buy_fee = parseFloat(data.buy_fee) || 0;
                settings.sell_fee = parseFloat(data.sell_fee) || 0;
                settings.balance_toman = data.balance_toman || "7,000,000,000 تومان";
                settings.balance_dram = data.balance_dram || "10,000,000 درام";
                applySettingsUI();
            }
        } catch (e) {
            console.log("خطا در دریافت تنظیمات زنده:", e);
            applySettingsUI();
        }
    }

    function applySettingsUI() {
        document.getElementById('disp-toman').innerText = settings.balance_toman;
        document.getElementById('disp-dram').innerText = settings.balance_dram;
        document.getElementById('disp-base-rate').innerText = settings.base_rate;

        // پر کردن مقادیر پنل ادمین
        document.getElementById('admin-toman').value = settings.balance_toman;
        document.getElementById('admin-dram').value = settings.balance_dram;
        document.getElementById('admin-base-rate').value = settings.base_rate;
        document.getElementById('admin-buy-fee').value = settings.buy_fee;
        document.getElementById('admin-sell-fee').value = settings.sell_fee;

        calculateOrder();
    }

    function calculateOrder() {
        const tradeType = document.getElementById('trade-type').value;
        const amount = parseFloat(document.getElementById('order-amount').value) || 0;
        const baseRate = parseFloat(settings.base_rate) || 0;
        const fee = tradeType === 'buy' ? settings.buy_fee : settings.sell_fee;

        let effectiveRate = baseRate;
        if (tradeType === 'buy') {
            effectiveRate = baseRate * (1 + (fee / 100));
        } else {
            effectiveRate = baseRate * (1 - (fee / 100));
        }

        const totalPrice = amount * effectiveRate;

        document.getElementById('calc-effective-rate').innerText = Math.round(effectiveRate).toLocaleString('fa-IR') + ' تومان';
        document.getElementById('calc-total-price').innerText = Math.round(totalPrice).toLocaleString('fa-IR') + ' تومان';
    }

    function submitOrder() {
        const tradeType = document.getElementById('trade-type').value;
        const amount = document.getElementById('order-amount').value;
        const name = document.getElementById('order-name').value;
        const whatsapp = document.getElementById('order-whatsapp').value;
        const totalPrice = document.getElementById('calc-total-price').innerText;

        if (!amount || !name || !whatsapp) {
            tg.showAlert("لطفاً تمامی فیلدها را پر کنید.");
            return;
        }

        const orderId = 'AMD-' + Math.floor(100000 + Math.random() * 900000);
        const payload = {
            action: "submit_order",
            order_id: orderId,
            name: name,
            whatsapp: whatsapp,
            amount: amount,
            trade_type: tradeType === 'buy' ? 'خرید از صرافی' : 'فروش به صرافی',
            total_price: totalPrice
        };

        tg.sendData(JSON.stringify(payload));
    }

    function updateSettings() {
        const payload = {
            action: "update_settings",
            balance_toman: document.getElementById('admin-toman').value,
            balance_dram: document.getElementById('admin-dram').value,
            base_rate: document.getElementById('admin-base-rate').value,
            buy_fee: document.getElementById('admin-buy-fee').value,
            sell_fee: document.getElementById('admin-sell-fee').value
        };

        tg.sendData(JSON.stringify(payload));
    }

    fetchSettings();
</script>

</body>
    </html>
